ServerTokens Prod
ServerSignature Off

<Directory /var/www/html/.runtime>
    Require all denied
</Directory>

<Files "interno.php">
    Require all denied
</Files>

<Directory /var/www/html/php_appest>
    Options -Indexes
</Directory>

<Directory /var/www/html/php_appest/tools>
    Require all denied
</Directory>

<Directory /var/www/html/php_appest/tests>
    Require all denied
</Directory>

<FilesMatch "(?i)(^\.|\.sql$|^(config|conexao|auth|dashboard_config|dashboard_util|estudo_validacao)\.php$)">
    Require all denied
</FilesMatch>
